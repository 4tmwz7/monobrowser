<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>MonoBrowser Split</title>
    <style>
      :root {
        font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; background: var(--mb-bg, #0a0a0a); }
      /* While the divider or a tab is dragged the frame floats above the pages and must not hide them. */
      body.dragging, body.drop { background: transparent; }
      body.dragging { cursor: col-resize; }
      .pane {
        position: absolute;
        border: 1px solid var(--mb-border, #3a3a36);
        pointer-events: none;
        transition: border-color var(--mb-dur, 160ms) var(--mb-ease, cubic-bezier(.2,.7,.2,1));
      }
      .pane.active { border: 2px solid var(--mb-accent, #9c9b95); }
      body.drop .pane { display: none; }
      #divider { position: absolute; cursor: col-resize; touch-action: none; }
      #divider::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 44px;
        margin: -22px 0 0 -1px;
        background: var(--mb-border, #3a3a36);
        transition: background var(--mb-dur, 160ms) var(--mb-ease, cubic-bezier(.2,.7,.2,1));
      }
      #divider:hover::after, body.dragging #divider::after { background: var(--mb-accent, #9c9b95); }
      body.drop #divider { display: none; }
      #zone {
        position: absolute;
        top: 6px;
        bottom: 6px;
        display: none;
        align-items: center;
        justify-content: center;
        border: 3px solid var(--mb-accent, #9c9b95);
        background: color-mix(in srgb, var(--mb-accent, #9c9b95) 22%, transparent);
        pointer-events: none;
      }
      #zone span {
        padding: 8px 14px;
        background: var(--mb-fg, #f0efe9);
        color: var(--mb-bg, #0a0a0a);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      body.drop #zone.on { display: flex; }
    </style>
  </head>
  <body>
    <div id="pane-left" class="pane"></div>
    <div id="pane-right" class="pane"></div>
    <div id="divider" role="separator" aria-orientation="vertical"></div>
    <div id="zone"><span id="zone-label"></span></div>
    <script src="split-frame.js"></script>
  </body>
</html>
