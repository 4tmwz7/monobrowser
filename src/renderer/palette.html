<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>MonoBrowser Palette</title>
    <style>
      :root {
        /*@mb-interaction-vars*/
        --black: var(--mb-fg, #0a0a0a);
        --white: var(--mb-bg, #f0efe9);
        --accent: var(--mb-accent, #9c9b95);
        --grey: var(--mb-muted, #5c5b57);
        --on-accent: var(--mb-on-accent, #0a0a0a);
        font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      /* Room for the hard offset shadow inside the view, so it is never clipped into a stray strip. */
      body { padding: 0 6px 6px 0; }
      #palette {
        width: 100%;
        height: fit-content;
        display: flex;
        flex-direction: column;
        border: 3px solid var(--black);
        background: var(--white);
        box-shadow: 5px 5px 0 var(--accent);
      }
      #palette-input {
        width: 100%;
        height: 40px;
        flex: 0 0 40px;
        padding: 0 10px;
        border: 0;
        border-bottom: 2px solid var(--black);
        border-radius: 0;
        outline: 0;
        background: var(--white);
        color: var(--black);
        font: inherit;
        font-size: 13px;
      }
      #palette-input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      #palette-list {
        list-style: none;
        margin: 0;
        padding: 3px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1px;
        max-height: none;
      }
      .palette-row {
        min-height: 30px;
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        border: 0;
        background: var(--white);
        color: var(--black);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        text-align: left;
        width: 100%;
      }
      .palette-row:hover { background: var(--ctl-hover-bg); }
      .palette-row:active { background: var(--ctl-press-bg); }
      .palette-row.selected, .palette-row.selected:hover { background: var(--ctl-sel-bg); box-shadow: inset 3px 0 0 var(--black); }
      .palette-row .kind {
        flex: 0 0 auto;
        width: 13px;
        height: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .palette-row .kind svg { width: 11px; height: 11px; fill: currentColor; }
      .palette-row .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .palette-row .hint { min-width: min-content; justify-self: end; max-width: min(300px, 45vw); padding-left: 8px; overflow: hidden; text-overflow: ellipsis; text-align: right; color: var(--grey); font-size: 11px; white-space: nowrap; }
      .palette-empty {
        min-height: 30px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        color: var(--grey);
        font-size: 12px;
      }
      #palette-footer {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        border-top: 2px solid var(--black);
        color: var(--grey);
        font-size: 11px;
        line-height: 1.4;
      }
      #palette-footer span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="palette" data-mb-overlay="pop" role="dialog" aria-label="Paleta komend">
      <input id="palette-input" type="text" placeholder="Wpisz komendę…" autocomplete="off" spellcheck="false" />
      <ul id="palette-list" aria-live="polite"></ul>
      <div id="palette-footer">
        <span id="palette-hint-arrows">↑↓ Wybór · Enter Uruchom · Esc Zamknij</span>
        <span id="palette-count"></span>
      </div>
    </div>
    <script src="./palette.js"></script>
  </body>
</html>
