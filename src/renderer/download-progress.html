<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 4px; }
      .card {
        width: 100%;
        min-width: 0;
        padding: 11px 12px 10px;
        border: 2px solid #f0efe9;
        background: #0a0a0a;
        color: #f0efe9;
        box-shadow: 5px 5px 0 rgba(156, 155, 149, 0.65);
      }
      .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; }
      .value { color: #b5b4ae; font-size: 10px; white-space: nowrap; }
      .track { height: 7px; margin-top: 10px; border: 1px solid #f0efe9; background: #242421; overflow: hidden; }
      .fill { width: 0; height: 100%; background: #f0efe9; transition: width 120ms linear; }
      .track.indeterminate .fill { width: 38%; animation: sweep 1.1s linear infinite; }
      .meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; color: #9c9b95; font-size: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
      @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <section class="card" aria-live="polite">
      <div class="top"><div id="name" class="name">Pobieranie</div><div id="value" class="value">0%</div></div>
      <div id="track" class="track"><div id="fill" class="fill"></div></div>
      <div class="meta"><span id="status">Pobieranie</span><span id="bytes"></span></div>
    </section>
    <script>
      const api = window.downloadProgressApi;
      const nameElement = document.getElementById("name");
      const valueElement = document.getElementById("value");
      const trackElement = document.getElementById("track");
      const fillElement = document.getElementById("fill");
      const statusElement = document.getElementById("status");
      const bytesElement = document.getElementById("bytes");

      const formatBytes = (value) => {
        if (!Number.isFinite(value) || value <= 0) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
        const amount = value / (1024 ** index);
        return `${amount >= 10 || index === 0 ? amount.toFixed(0) : amount.toFixed(1)} ${units[index]}`;
      };

      api.onUpdated((payload) => {
        const record = payload.downloads[0];
        if (!record) return;
        const polish = payload.language === "pl";
        document.documentElement.lang = polish ? "pl" : "en";
        nameElement.textContent = record.fileName || (polish ? "Pobieranie" : "Download");

        const total = Number(record.totalBytes) || 0;
        const received = Math.max(0, Number(record.receivedBytes) || 0);
        const percent = total > 0 ? Math.max(0, Math.min(100, Math.round(received / total * 100))) : null;
        trackElement.classList.toggle("indeterminate", record.status === "in-progress" && percent === null);
        fillElement.style.width = percent === null ? "38%" : `${percent}%`;
        valueElement.textContent = percent === null ? "…" : `${percent}%`;

        const labels = polish
          ? { "in-progress": "Pobieranie", completed: "Ukończono", cancelled: "Anulowano", interrupted: "Przerwano", failed: "Błąd" }
          : { "in-progress": "Downloading", completed: "Completed", cancelled: "Cancelled", interrupted: "Interrupted", failed: "Failed" };
        const extra = payload.downloads.length > 1 ? ` +${payload.downloads.length - 1}` : "";
        statusElement.textContent = `${labels[record.status] || record.status}${extra}`;
        bytesElement.textContent = total > 0
          ? `${formatBytes(received)} / ${formatBytes(total)}`
          : formatBytes(received);
      });
    </script>
  </body>
</html>
