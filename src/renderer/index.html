<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>MonoBrowser</title>
    <style>
      :root {
        color-scheme: light;
        --black: #0a0a0a;
        --white: #f0efe9;
        --accent: #9c9b95;
        --grey: #5c5b57;
        --chrome-bg: var(--black);
        --chrome-surface: var(--white);
        --chrome-border: var(--black);
        --chrome-hover: var(--accent);
        --chrome-active-tab: var(--white);
        --chrome-inactive-tab: var(--black);
        --text-primary: var(--black);
        --text-secondary: #a5a49e;
        --address-bg: var(--white);
        --address-border: var(--black);
        --address-focus: var(--black);
        font-family:
          ui-monospace,
          "Cascadia Mono",
          "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--black);
        color: var(--text-primary);
        overflow: hidden;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        opacity: 0.025;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      #tab-strip {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 38px;
        background: var(--chrome-bg);
        display: flex;
        align-items: flex-end;
        padding: 0;
        gap: 0;
        user-select: none;
        -webkit-app-region: drag;
        z-index: 10;
      }

      #tabs {
        display: flex;
        align-items: flex-end;
        gap: 0;
        flex: 1;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -webkit-app-region: no-drag;
        scroll-behavior: smooth;
      }

      #tab-list {
        display: flex;
        align-items: flex-end;
        gap: 0;
        flex-shrink: 0;
      }

      #tabs::-webkit-scrollbar {
        display: none;
      }

      .tab-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 33px;
        width: max-content;
        max-width: 220px;
        min-width: 120px;
        padding: 0 10px 0 12px;
        background: var(--chrome-inactive-tab);
        border: 1px solid #3b3b38;
        border-bottom: none;
        border-radius: 0;
        color: var(--text-secondary);
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.1s,
          color 0.1s;
        -webkit-app-region: no-drag;
        white-space: nowrap;
        position: relative;
      }

      .tab-btn:hover {
        background: #242421;
        color: var(--white);
      }

      .tab-btn.active {
        background: var(--chrome-active-tab);
        border-color: var(--chrome-border);
        color: var(--text-primary);
        z-index: 1;
      }

      .tab-favicon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.7;
      }

      .tab-status {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab-status:empty {
        display: none;
      }

      .tab-status svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }

      .tab-title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .tab-btn.pinned {
        width: 52px;
        min-width: 52px;
        max-width: 52px;
        padding: 0 8px;
        justify-content: center;
      }

      .tab-btn.pinned .tab-title,
      .tab-btn.pinned .close-tab {
        display: none;
      }

      .tab-btn.sleeping {
        opacity: 0.55;
      }

      .tab-btn.sleeping:hover {
        opacity: 0.85;
      }

      .tab-btn.sleeping .tab-title {
        color: var(--text-secondary);
      }

      .tab-loading {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        border: 2px solid var(--accent);
        border-top-color: var(--white);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }

      .tab-btn.loading .tab-loading {
        display: block;
      }
      .tab-btn.loading .tab-favicon {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .close-tab {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        transition:
          background 0.1s,
          color 0.1s;
        padding: 0;
      }

      .close-tab:hover {
        background: var(--black);
        color: var(--white);
      }

      .tab-btn:not(.active) .close-tab:hover {
        background: var(--white);
        color: var(--black);
      }

      #new-tab {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        transition:
          background 0.1s,
          color 0.1s;
        margin-bottom: 2px;
        -webkit-app-region: no-drag;
      }

      #new-tab:hover {
        background: var(--white);
        color: var(--black);
      }

      /* ── Nav bar ───────────────────────────────────────────── */
      #nav-bar {
        position: fixed;
        top: 38px;
        left: 0;
        right: 0;
        height: 46px;
        background: var(--chrome-surface);
        border-bottom: 3px solid var(--chrome-border);
        display: flex;
        align-items: center;
        padding: 0 7px;
        gap: 3px;
        z-index: 10;
      }

      .nav-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        background: transparent;
        color: var(--black);
        border-radius: 0;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.1s,
          color 0.1s;
      }

      .nav-btn:hover:not(:disabled) {
        border-color: var(--black);
        background: var(--black);
        color: var(--white);
      }

      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .nav-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }


      #app-menu-wrap {
        position: relative;
        flex-shrink: 0;
      }

      #menu-button {
        line-height: 1;
      }

      /* ── Address bar ──────────────────────────────────────── */
      #address-form {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--address-bg);
        border: 2px solid var(--address-border);
        border-radius: 0;
        height: 34px;
        padding: 0 12px 0 14px;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
        gap: 8px;
      }

      #address-form:focus-within {
        border-color: var(--address-focus);
        background: var(--white);
        transform: translate(-2px, -2px);
        box-shadow: 3px 3px 0 var(--accent);
      }

      .address-icon {
        width: 24px;
        height: 26px;
        flex-shrink: 0;
        color: var(--grey);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .address-icon:hover,
      .address-icon:focus-visible {
        background: var(--black);
        color: var(--white);
        outline: none;
      }

      .address-icon svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      #address {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
        caret-color: var(--black);
      }

      #address::placeholder {
        color: var(--text-secondary);
      }

      #address::selection {
        background: var(--accent);
      }

      #go {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-radius: 0;
        color: var(--grey);
        cursor: pointer;
        transition:
          background 0.1s,
          color 0.1s;
        padding: 0;
      }

      #go:hover {
        background: var(--black);
        color: var(--white);
      }

      /* ── Placeholder black screen ─────────────────────────── */
      #placeholder {
        position: fixed;
        top: 84px;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Tab strip -->
    <div id="tab-strip">
      <div
        id="tabs"
        aria-label="Karty">
        <div id="tab-list"></div>
        <button
          id="new-tab"
          type="button"
          title="Nowa karta (Ctrl+T)"
          aria-label="Nowa karta">
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="currentColor">
            <path
              d="M8 2.5a.75.75 0 0 1 .75.75v4h4a.75.75 0 0 1 0 1.5h-4v4a.75.75 0 0 1-1.5 0v-4h-4a.75.75 0 0 1 0-1.5h4v-4A.75.75 0 0 1 8 2.5Z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Navigation bar -->
    <div id="nav-bar">
      <button
        id="back"
        class="nav-btn"
        aria-label="Wstecz"
        title="Wstecz (Alt+←)">
        <svg viewBox="0 0 16 16">
          <path
            d="M13.5 8a.75.75 0 0 0-.75-.75H4.81l2.72-2.72a.75.75 0 0 0-1.06-1.06l-4 4a.75.75 0 0 0 0 1.06l4 4a.75.75 0 0 0 1.06-1.06L4.81 8.75H12.75A.75.75 0 0 0 13.5 8Z" />
        </svg>
      </button>
      <button
        id="forward"
        class="nav-btn"
        aria-label="Dalej"
        title="Dalej (Alt+→)">
        <svg viewBox="0 0 16 16">
          <path
            d="M2.5 8a.75.75 0 0 1 .75-.75H11.19L8.47 4.53a.75.75 0 0 1 1.06-1.06l4 4a.75.75 0 0 1 0 1.06l-4 4a.75.75 0 0 1-1.06-1.06l2.72-2.72H3.25A.75.75 0 0 1 2.5 8Z" />
        </svg>
      </button>
      <button
        id="reload"
        class="nav-btn"
        aria-label="Odśwież"
        title="Odśwież (Ctrl+R)">
        <svg viewBox="0 0 16 16">
          <path
            d="M13.57 6.25a.75.75 0 0 0-1.42-.5l-.26.73A5.002 5.002 0 0 0 3 8a5 5 0 1 0 9.41-2.4.75.75 0 1 0-1.35.65A3.5 3.5 0 1 1 8 4.5c1.2 0 2.26.6 2.9 1.52l-.84-.29a.75.75 0 0 0-.5 1.41l2.5.88a.75.75 0 0 0 .96-.46l.55-1.56a.75.75 0 0 0-.5-.94Z" />
        </svg>
      </button>
      <form id="address-form">
        <button
          id="site-info-button"
          class="address-icon"
          type="button"
          aria-haspopup="menu"
          aria-label="Informacje o stronie"
          title="Informacje o stronie">
          <svg viewBox="0 0 16 16">
            <path
              d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm-1 3.75A.75.75 0 0 1 8 4a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0v-.5Zm.25 2.5h1.5a.75.75 0 0 1 0 1.5H8.5V11a.75.75 0 0 1-1.5 0V8a.75.75 0 0 1 .75-.75h.5Z" />
          </svg>
        </button>
        <input
          id="address"
          placeholder="Szukaj lub wpisz adres"
          autocomplete="off"
          spellcheck="false" />
        <button
          id="go"
          type="submit"
          title="Przejdź (Enter)"
          aria-label="Przejdź">
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="currentColor">
            <path
              d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06l2.97-2.97H2.75a.75.75 0 0 1 0-1.5h8.44L8.22 4.03a.75.75 0 0 1 0-1.06Z" />
          </svg>
        </button>
      </form>
      <div id="app-menu-wrap">
        <button id="menu-button" class="nav-btn" type="button" aria-haspopup="menu" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 3.25h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Zm0 4h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Zm0 4h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Z" />
          </svg>
        </button>
      </div>
    </div>

    <div id="placeholder"></div>
    <script src="./app.js"></script>
  </body>
</html>
