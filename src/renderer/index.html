<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: crx:" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>MonoBrowser</title>
    <style>
      :root {
        /* Theme contract: every shell color derives from the unified --mb-* tokens (injected by the main process);
           fallbacks equal the default dark monochrome look. color-scheme comes from the injected theme block. */
        --tabbar-bg: var(--mb-surface, #161614);
        --tabbar-fg: var(--mb-fg, #f0efe9);
        --tab-bg: var(--mb-surface, #161614);
        --tab-fg: var(--mb-muted, #a5a49e);
        --tab-active-bg: var(--mb-surface-2, #242421);
        --tab-active-fg: var(--mb-fg, #f0efe9);
        --tab-active-border: var(--mb-fg, #f0efe9);
        --tab-hover-bg: color-mix(in srgb, var(--mb-surface-2, #242421) 55%, var(--mb-surface, #161614));
        /* One interaction language for every toolbar control: quiet hover fill, stronger pressed fill, accent outline for keyboard focus only. */
        --ctl-hover-bg: color-mix(in srgb, var(--mb-fg, #f0efe9) 16%, var(--tabbar-bg));
        --ctl-press-bg: color-mix(in srgb, var(--mb-fg, #f0efe9) 26%, var(--tabbar-bg));
        --toolbar-input-bg: var(--mb-bg, #0a0a0a);
        --toolbar-input-fg: var(--mb-fg, #f0efe9);
        --accent: var(--mb-accent, #9c9b95);
        --on-accent: var(--mb-on-accent, #0a0a0a);
        --tabbar-line: var(--mb-border, #3a3a36);
        --sidebar-width: 240px;
        font-family:
          ui-monospace,
          "Cascadia Mono",
          "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--tabbar-bg);
        color: var(--tabbar-fg);
        overflow: hidden;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        opacity: 0.025;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      button {
        font-family: inherit;
        color: inherit;
      }

      /* ── Chrome: single compact row (horizontal layout) ─────── */
      #chrome {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        transition: width var(--mb-dur-slow, 320ms) var(--mb-ease, ease);
        background: var(--tabbar-bg);
        color: var(--tabbar-fg);
        border-bottom: 1px solid var(--tabbar-line);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px;
        user-select: none;
        z-index: 10;
      }

      /* Menu functions pinned by the user; the buttons are flex items of #chrome-actions. */
      #toolbar-pins {
        display: contents;
      }

      /* Extension actions (<browser-action-list> from electron-chrome-extensions): same 28px square buttons as the
         other toolbar controls, gray until hovered. The host is hidden by app.ts while no extension has an action. */
      #ext-actions {
        display: contents;
      }

      #ext-actions[hidden] {
        display: none;
      }

      #ext-actions browser-action-list {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 1px;
        flex-shrink: 0;
        --browser-action-hover-bg: var(--ctl-hover-bg);
        --browser-action-badge-outline: var(--tabbar-line);
      }

      /* Extension icons are usually dark artwork meant for a light toolbar: each one sits on a light, neutral tile so it
         stays visible on every theme (gray until hovered, like the rest of the monochrome toolbar). */
      #ext-actions browser-action-list::part(action) {
        width: 28px;
        height: 28px;
        padding: 3px;
        border-radius: 0;
        background-color: #d9d8d2;
        background-clip: content-box;
        background-origin: content-box;
        background-size: 82%;
        filter: grayscale(1);
        opacity: 0.8;
        cursor: pointer;
        transition: opacity var(--mb-dur, 160ms) var(--mb-ease, ease), filter var(--mb-dur, 160ms) var(--mb-ease, ease);
      }

      #ext-actions browser-action-list::part(action):hover {
        background-color: #f4f3ee;
        filter: none;
        opacity: 1;
      }

      #ext-actions browser-action-list::part(action):active {
        background-color: #ffffff;
      }

      #ext-actions browser-action-list::part(action):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      body.vertical.collapsed #ext-actions browser-action-list {
        flex-direction: column;
      }

      #extensions-button[hidden] {
        display: none;
      }

      #nav-buttons,
      #chrome-actions {
        display: flex;
        align-items: center;
        gap: 1px;
        flex-shrink: 0;
      }

      .nav-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: var(--tabbar-fg);
        border-radius: 0;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color var(--mb-dur, 160ms) var(--mb-ease, ease), border-color var(--mb-dur, 160ms) var(--mb-ease, ease), color var(--mb-dur, 160ms) var(--mb-ease, ease), opacity var(--mb-dur, 160ms) var(--mb-ease, ease), transform var(--mb-dur, 160ms) var(--mb-ease, ease);
      }

      /* Shared states: hover = quiet fill, pressed = stronger fill, keyboard focus = accent outline. */
      .nav-btn:hover:not(:disabled),
      #new-tab:hover,
      #zoom-pill:hover,
      .tab-btn:hover,
      #ws-switch:hover,
      .ws-btn:hover,
      #ws-add:hover {
        background: var(--ctl-hover-bg);
        color: var(--tabbar-fg);
      }

      .nav-btn:focus-visible,
      #new-tab:focus-visible,
      #zoom-pill:focus-visible,
      .tab-btn:focus-visible,
      #ws-switch:focus-visible,
      .ws-btn:focus-visible,
      #ws-add:focus-visible,
      .address-icon:focus-visible {
        background: var(--ctl-hover-bg);
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .nav-btn:active:not(:disabled),
      #new-tab:active,
      #zoom-pill:active,
      .tab-btn:active,
      #ws-switch:active,
      .ws-btn:active,
      #ws-add:active {
        background: var(--ctl-press-bg);
        transform: scale(var(--mb-press, 0.98));
      }

      .nav-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .nav-btn svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }

      .vertical-only {
        display: none;
      }

      /* ── Address bar ──────────────────────────────────────── */
      #address-form {
        flex: 0 0 clamp(240px, 30vw, 520px);
        display: flex;
        align-items: center;
        background: var(--toolbar-input-bg);
        color: var(--toolbar-input-fg);
        border: 1px solid color-mix(in srgb, var(--toolbar-input-fg) 30%, var(--toolbar-input-bg));
        border-radius: 0;
        height: 26px;
        padding: 0 8px 0 2px;
        gap: 4px;
        transition: border-color var(--mb-dur, 180ms) var(--mb-ease, ease), box-shadow var(--mb-dur, 180ms) var(--mb-ease, ease), background-color var(--mb-dur, 180ms) var(--mb-ease, ease);
      }

      #address-form:hover {
        border-color: color-mix(in srgb, var(--toolbar-input-fg) 60%, var(--toolbar-input-bg));
      }

      #address-form:focus-within {
        border-color: var(--toolbar-input-fg);
        box-shadow: inset 0 0 0 1px var(--toolbar-input-fg);
      }

      .address-icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        color: color-mix(in srgb, var(--toolbar-input-fg) 65%, var(--toolbar-input-bg));
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .address-icon:hover {
        background: color-mix(in srgb, var(--toolbar-input-fg) 16%, var(--toolbar-input-bg));
        color: var(--toolbar-input-fg);
      }

      .address-icon:active {
        background: color-mix(in srgb, var(--toolbar-input-fg) 28%, var(--toolbar-input-bg));
      }

      .address-icon svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      #address {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        outline: none;
        color: var(--toolbar-input-fg);
        font-size: 12px;
        font-family: inherit;
        caret-color: var(--toolbar-input-fg);
      }

      #address::placeholder {
        color: color-mix(in srgb, var(--toolbar-input-fg) 55%, var(--toolbar-input-bg));
      }

      #address::selection {
        color: var(--on-accent);
        background: var(--accent);
      }

      /* ── Tabs ─────────────────────────────────────────────── */
      #tabs {
        flex: 1 1 0;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      #pinned-list,
      #tab-divider {
        display: none;
      }

      #tab-scroll {
        flex: 0 1 auto;
        min-width: 0;
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        display: flex;
        align-items: center;
      }

      #tab-scroll::-webkit-scrollbar {
        display: none;
      }

      /* Edge fade where tabs are scrolled out of view (--fade-start / --fade-end are set by app.ts). */
      #tab-scroll {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-start, 0px), #000 calc(100% - var(--fade-end, 0px)), transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-start, 0px), #000 calc(100% - var(--fade-end, 0px)), transparent 100%);
      }

      body.vertical #tab-scroll {
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-start, 0px), #000 calc(100% - var(--fade-end, 0px)), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-start, 0px), #000 calc(100% - var(--fade-end, 0px)), transparent 100%);
      }

      #tab-list {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .tab-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        width: 200px;
        flex: 0 1 200px;
        min-width: 140px;
        padding: 0 4px 0 8px;
        background: var(--tab-bg);
        border: 1px solid color-mix(in srgb, var(--tab-fg) 28%, var(--tab-bg));
        border-radius: 0;
        color: var(--tab-fg);
        font-size: 11px;
        cursor: pointer;
        transition: background-color var(--mb-dur-fast, 120ms) var(--mb-ease, ease), border-color var(--mb-dur-fast, 120ms) var(--mb-ease, ease), color var(--mb-dur-fast, 120ms) var(--mb-ease, ease), opacity var(--mb-dur, 180ms) var(--mb-ease, ease), transform var(--mb-dur-fast, 120ms) var(--mb-ease, ease);
        white-space: nowrap;
        position: relative;
        overflow: hidden;
        text-align: left;
      }

      /* Active-tab indicator: a thin accent line that grows from the side the previously active tab was on (app.ts sets
         --ind-origin on both tabs), so the selection appears to slide along the strip. transform only. */
      .tab-btn:not(.split-member)::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: var(--ind-origin, left center);
        transition: transform var(--mb-dur, 180ms) var(--mb-ease, ease);
        pointer-events: none;
      }

      .tab-btn.active:not(.split-member)::after {
        transform: scaleX(1);
      }

      body.vertical .tab-btn:not(.pinned):not(.split-member)::after {
        right: auto;
        top: 0;
        width: 2px;
        height: auto;
        transform: scaleY(0);
        transform-origin: var(--ind-origin, center top);
      }

      body.vertical .tab-btn.active:not(.pinned):not(.split-member)::after {
        transform: scaleY(1);
      }

      /* Loading: a short bar sweeps along the top edge of the tab (phase vars keep it continuous across strip rebuilds). */
      @keyframes mb-load-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(260%); }
      }

      .tab-btn.loading::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 2px;
        background: linear-gradient(90deg, transparent, currentColor, transparent);
        opacity: calc(var(--mb-on, 1) * .7);
        animation: mb-load-sweep 1.2s ease-in-out infinite;
        animation-delay: var(--pw, 0s);
        pointer-events: none;
      }

      .tab-btn.active {
        background: var(--tab-active-bg);
        border-color: var(--tab-active-border);
        color: var(--tab-active-fg);
      }

      .tab-btn.private {
        border-top: 2px dashed var(--accent);
      }

      .tab-btn.private .tab-title {
        font-style: italic;
      }

      .tab-btn.dragging {
        opacity: 0.4;
      }

      .tab-btn.drop-before {
        box-shadow: -2px 0 0 0 var(--accent);
      }

      .tab-btn.drop-after {
        box-shadow: 2px 0 0 0 var(--accent);
      }

      .tab-favicon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border-radius: 0;
        object-fit: contain;
      }

      .tab-favicon-internal {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: square;
      }

      /* Monochrome letter tile: fallback when a site has no favicon (both layouts). */
      .tab-letter {
        display: none;
        box-sizing: border-box;
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid currentColor;
        border-radius: 0;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-align: center;
        /* Cap-height centering: capitals sit ~1px high inside the line box (padding shifts the glyph by half its value). */
        padding-top: 2px;
      }

      .tab-btn.no-icon .tab-letter {
        display: flex;
      }

      .tab-audio {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        padding: 0;
      }

      .tab-audio:hover {
        background: color-mix(in srgb, currentColor 22%, transparent);
      }

      .tab-audio svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }

      .tab-btn.muted .tab-audio {
        opacity: 0.6;
      }

      /* Zoom indicator pill (click resets to 100%). */
      #zoom-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        min-width: 48px;
        padding: 0 8px;
        border: 1px solid color-mix(in srgb, var(--tab-fg) 28%, var(--tab-bg));
        border-radius: 0;
        background: transparent;
        color: var(--tabbar-fg);
        font: inherit;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      #zoom-pill:not([hidden]) {
        animation: mb-fade-in var(--mb-dur, 160ms) var(--mb-ease, ease) both;
      }

      /* No width easing while the sidebar edge is being dragged. */
      #chrome:has(#sidebar-resizer.dragging) {
        transition: none;
      }

      #placeholder {
        animation: mb-fade-in var(--mb-dur-slow, 240ms) var(--mb-ease, ease) both;
      }

      #zoom-pill[hidden] {
        display: none !important;
      }

      body.dropping #chrome {
        outline: 2px dashed var(--accent);
        outline-offset: -3px;
      }

      .tab-btn.loading .tab-letter {
        display: none !important;
      }

      .tab-status {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab-status:empty {
        display: none;
      }

      .tab-status svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }

      .tab-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .tab-btn.pinned {
        width: 32px;
        min-width: 32px;
        flex: 0 0 32px;
        padding: 0;
        justify-content: center;
      }

      .tab-btn.pinned .tab-title,
      .tab-btn.pinned .close-tab {
        display: none;
      }

      /* Icon-only tabs (pinned, collapsed sidebar): 32px fits one icon, so the status
         icons are hidden (sleeping is dimmed, private has a dashed border) and the audio
         icon becomes a small badge in the corner. */
      .tab-btn.pinned .tab-status,
      body.vertical.collapsed .tab-btn .tab-status {
        display: none;
      }

      .tab-btn.pinned .tab-audio,
      body.vertical.collapsed .tab-btn .tab-audio {
        position: absolute;
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        background: var(--mb-surface, var(--tab-bg));
        color: var(--mb-fg, var(--tab-fg));
      }

      .tab-btn.pinned .tab-audio svg,
      body.vertical.collapsed .tab-btn .tab-audio svg {
        width: 10px;
        height: 10px;
      }

      .tab-btn.sleeping {
        opacity: 0.55;
      }

      .tab-btn.sleeping:hover {
        opacity: 0.85;
      }

      .tab-loading {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        border: 2px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        animation-delay: var(--ps, 0s);
        display: none;
      }

      .tab-btn.loading .tab-loading {
        display: block;
      }

      /* Reduced motion: the loading state stays visible but static (a ring and a thin line instead of spinning / sweeping). */
      @media (prefers-reduced-motion: reduce) {
        .tab-loading { animation: none; }
        .tab-btn.loading::before { animation: none; width: 100%; opacity: .45; }
      }

      .tab-btn.loading .tab-favicon {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .close-tab {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        color: inherit;
        opacity: 0.75;
        border-radius: 0;
        cursor: pointer;
        padding: 0;
      }

      .close-tab:hover {
        opacity: 1;
        background: color-mix(in srgb, currentColor 22%, transparent);
      }

      #new-tab {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        background: transparent;
        color: var(--tab-fg);
        border-radius: 0;
        cursor: pointer;
        transition: background-color var(--mb-dur, 160ms) var(--mb-ease, ease), border-color var(--mb-dur, 160ms) var(--mb-ease, ease), color var(--mb-dur, 160ms) var(--mb-ease, ease), opacity var(--mb-dur, 160ms) var(--mb-ease, ease), transform var(--mb-dur, 160ms) var(--mb-ease, ease);
      }

      #new-tab svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        flex-shrink: 0;
      }

      /* ── Workspaces (przestrzenie) ─────────────────────────── */
      #ws-switch,
      .ws-btn,
      #ws-add {
        position: relative;
        width: 28px;
        height: 28px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 0;
        background: transparent;
        color: var(--tab-fg);
        font-size: 18px;
        font-weight: 400;
        font-family: inherit;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        transition: background var(--mb-dur, 180ms) var(--mb-ease, cubic-bezier(.22, 1, .36, 1)), color var(--mb-dur, 180ms) var(--mb-ease, cubic-bezier(.22, 1, .36, 1));
      }

      #ws-add svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        flex-shrink: 0;
      }

      #ws-switch-icon,
      .ws-btn {
        font-variant-emoji: text;
      }

      #ws-switch-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
      }

      .ws-glyph {
        display: block;
        flex: none;
      }

      /* Horizontal switcher: same look as the other toolbar buttons (no frame); shows the current space icon. */
      #ws-switch {
        color: var(--tabbar-fg);
      }

      #ws-switch .ws-glyph {
        width: 16px;
        height: 16px;
      }

      /* A small caret tells the glyph is a dropdown (a bare square next to reload looks like "stop"). */
      #ws-switch {
        width: auto;
        min-width: 28px;
        padding: 0 5px;
        gap: 2px;
      }

      #ws-switch-icon {
        width: 18px;
      }

      .ws-caret {
        width: 8px;
        height: 8px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: square;
        opacity: 0.8;
      }

      body.vertical .ws-caret {
        display: none;
      }

      #ws-switch::after,
      .ws-btn::after {
        content: "";
        position: absolute;
        left: 3px;
        right: 3px;
        bottom: 2px;
        height: 2px;
        background: transparent;
      }

      #ws-switch::after {
        background: var(--ws-accent, transparent);
      }

      .ws-btn::after {
        background: var(--ws-color, transparent);
      }

      /* Hover/pressed/focus states for these live in the shared block next to .nav-btn. */
      /* The one clear active style: accent fill on the current space only. */
      .ws-btn.active,
      .ws-btn.active:hover,
      .ws-btn.active:active {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }

      .ws-btn.drop-target {
        box-shadow: 0 0 0 2px var(--accent);
      }

      #ws-bar {
        display: none;
      }

      @keyframes ws-enter {
        from { opacity: 0; transform: translateX(var(--ws-shift, 8px)); }
        to { opacity: 1; transform: none; }
      }

      /* Hook for the tab-list switch animation: restarted by app.ts whenever the workspace changes. */
      .ws-enter {
        animation: ws-enter var(--mb-dur, 180ms) var(--mb-ease, cubic-bezier(.22, 1, .36, 1));
      }

      .mb-no-anim .ws-enter {
        animation: none;
      }

      body.vertical #ws-switch {
        display: none;
      }

      body.vertical #ws-bar {
        display: flex;
        flex: none;
        align-items: center;
        flex-wrap: wrap;
        gap: 2px;
        padding-top: 4px;
        border-top: 1px solid var(--tabbar-line);
      }

      #ws-list {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        min-width: 0;
      }

      body.vertical.collapsed #ws-bar,
      body.vertical.collapsed #ws-list {
        flex-direction: column;
        flex-wrap: nowrap;
      }

      #new-tab-label {
        display: none;
        font-size: 12px;
      }

      #sidebar-resizer {
        display: none;
      }

      /* ── Vertical layout (sidebar) ────────────────────────── */
      body.vertical #chrome {
        right: auto;
        bottom: 0;
        width: var(--sidebar-width);
        height: auto;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 6px;
        border-bottom: 0;
        border-right: 1px solid var(--tabbar-line);
      }

      /* Labels that are still on screen while the sidebar width animates must not spill out of it. */
      body.vertical #chrome {
        overflow-x: clip;
      }

      /* Sidebar on the right edge: mirrors the left-hand layout. */
      body.vertical.sidebar-right #chrome {
        left: auto;
        right: 0;
        border-right: 0;
        border-left: 1px solid var(--tabbar-line);
      }

      /* Bottom rows (workspaces, actions) hug the window edge: mirrored order. */
      body.vertical.sidebar-right:not(.collapsed) #ws-bar,
      body.vertical.sidebar-right:not(.collapsed) #ws-list,
      body.vertical.sidebar-right:not(.collapsed) #chrome-actions {
        flex-direction: row-reverse;
      }

      body.vertical.sidebar-right #sidebar-resizer {
        right: auto;
        left: 0;
      }

      body.vertical .vertical-only {
        display: flex;
      }

      body.vertical #nav-buttons {
        justify-content: flex-start;
      }

      body.vertical #address-form {
        flex: 0 0 auto;
        width: auto;
        height: 28px;
      }

      body.vertical #tabs {
        flex-direction: column;
        align-items: stretch;
        height: auto;
        /* A flex item's min-height defaults to its content height: without this the tab list never shrinks, so with
           many tabs it pushes the sidebar's bottom actions out of the window instead of scrolling. */
        min-height: 0;
        gap: 4px;
      }

      body.vertical #pinned-list {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }

      body.vertical #pinned-list:empty {
        display: none;
      }

      body.vertical.has-pinned #tab-divider {
        display: block;
        flex: none;
        height: 1px;
        background: var(--tabbar-line);
        margin: 2px 0;
      }

      body.vertical #tab-scroll {
        flex: 0 1 auto;
        min-height: 0;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--accent) transparent;
        display: block;
      }

      body.vertical #tab-list {
        flex-direction: column;
        align-items: stretch;
        gap: 1px;
      }

      body.vertical .tab-btn {
        width: 100%;
        flex: 0 0 auto;
        height: 30px;
        min-width: 0;
        border-color: transparent;
        padding: 0 4px 0 8px;
      }

      body.vertical .tab-btn.active {
        border-color: var(--tab-active-border);
      }

      body.vertical .tab-btn.pinned {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        padding: 0;
        border-color: color-mix(in srgb, var(--tab-fg) 28%, var(--tab-bg));
      }

      body.vertical .tab-btn.pinned.active {
        border-color: var(--tab-active-border);
      }

      body.vertical .tab-btn.drop-before {
        box-shadow: 0 -2px 0 0 var(--accent);
      }

      body.vertical .tab-btn.drop-after {
        box-shadow: 0 2px 0 0 var(--accent);
      }

      body.vertical #pinned-list .tab-btn.drop-before {
        box-shadow: -2px 0 0 0 var(--accent);
      }

      body.vertical #pinned-list .tab-btn.drop-after {
        box-shadow: 2px 0 0 0 var(--accent);
      }

      body.vertical .tab-btn:not(.pinned) .close-tab {
        opacity: 0;
      }

      body.vertical .tab-btn:not(.pinned):hover .close-tab,
      body.vertical .tab-btn:not(.pinned) .close-tab:focus-visible {
        opacity: 0.85;
      }

      body.vertical .tab-btn:not(.pinned) .close-tab:hover {
        opacity: 1;
      }

      body.vertical #new-tab {
        width: 100%;
        height: 30px;
        justify-content: flex-start;
        padding: 0 8px;
      }

      body.vertical #new-tab-label {
        display: inline;
      }

      body.vertical #chrome-actions {
        flex-wrap: wrap;
        justify-content: flex-start;
        padding-top: 4px;
        border-top: 1px solid var(--tabbar-line);
      }

      body.vertical #sidebar-resizer {
        display: block;
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        width: 8px;
        cursor: col-resize;
        z-index: 20;
      }

      body.vertical #sidebar-resizer:hover,
      body.vertical #sidebar-resizer.dragging {
        background: var(--accent);
      }

      /* Collapsed sidebar: icons only. */
      body.vertical.collapsed #chrome {
        align-items: center;
      }

      body.vertical.collapsed #address-form,
      body.vertical.collapsed #sidebar-resizer {
        display: none;
      }

      body.vertical.collapsed #nav-buttons,
      body.vertical.collapsed #chrome-actions {
        flex-direction: column;
        align-items: center;
      }

      body.vertical.collapsed #tabs {
        width: 100%;
        align-items: center;
      }

      body.vertical.collapsed #pinned-list,
      body.vertical.collapsed #tab-scroll {
        width: 100%;
      }

      body.vertical.collapsed #pinned-list {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: center;
      }

      body.vertical.collapsed .tab-btn {
        justify-content: center;
        padding: 0;
        width: 100%;
      }

      body.vertical.collapsed .tab-btn.pinned {
        width: 32px;
      }

      body.vertical.collapsed .tab-title,
      body.vertical.collapsed .tab-btn .close-tab,
      body.vertical.collapsed #new-tab-label {
        display: none;
      }

      body.vertical.collapsed #new-tab {
        width: 32px;
        justify-content: center;
        padding: 0;
      }

      /* ── Split view: the two tabs of a split are joined in the tab bar ── */
      /* The pair shares one accent frame: accent top/bottom edges, a thick accent underline, and the joint between the two tabs is open. */
      .tab-btn.split-member {
        border-top-color: var(--accent);
        border-bottom-color: var(--accent);
        box-shadow: inset 0 -3px 0 var(--accent);
      }

      .tab-btn.split-join-next {
        margin-right: -2px;
        border-right-color: transparent;
        border-left-color: var(--accent);
      }

      .tab-btn.split-join-prev {
        border-left-style: dashed;
        border-left-color: var(--accent);
        border-right-color: var(--accent);
      }

      body.vertical .tab-btn.split-join-next {
        margin-right: 0;
        margin-bottom: -1px;
        border-right-color: inherit;
        border-bottom-color: transparent;
      }

      body.vertical .tab-btn.split-member {
        box-shadow: inset 3px 0 0 var(--accent);
        border-left-color: var(--accent);
      }

      body.vertical .tab-btn.split-join-prev {
        border-left-style: solid;
        border-top-style: dashed;
        border-top-color: var(--accent);
        border-right-color: var(--accent);
      }

      body.vertical .tab-btn.split-join-next {
        border-top-color: var(--accent);
        border-right-color: var(--accent);
      }

      /* ── Windows: the tab strip is the title bar ─────────────────────────────────
         The native window controls (Electron titleBarOverlay, same height as the strip) are drawn over the right
         end of the top bar; --wco-right (set by app.ts from the real geometry) keeps that end free. The empty part
         of the bar drags the window (double-click maximizes), everything interactive opts out. */
      #titlebar-drag {
        display: none;
      }

      /* Windows: the drag strip is always laid out (never toggled between display:none and block) so Chromium keeps its
         draggable-region list in sync in every layout. Where #chrome is the title bar itself (horizontal layout) it is
         an invisible duplicate underneath; the compact strip gives it its look below. */
      html.platform-win32:not(.chrome-overlay) #titlebar-drag {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        z-index: 0;
        pointer-events: auto;
      }

      html.platform-win32 {
        --wco-right: 138px;
      }

      html.platform-win32.window-fullscreen {
        --wco-right: 0px;
      }

      /* Horizontal layout: the single toolbar row is the title bar. Its bottom line (--tabbar-line) spans the whole
         width: the native controls are 1px shorter than the bar (titlebar.ts), so the line runs under them to the edge. */
      html.platform-win32 body:not(.vertical) #chrome {
        padding-right: calc(6px + var(--wco-right));
        -webkit-app-region: drag;
      }

      /* 1 px outline of the native controls: this vertical line just left of them (the bottom line is the bar's own
         border, the overlay is 1px shorter). Horizontal layout and the compact strip only; in the vertical layout the
         controls float over the page and main.ts draws the outline with a native view. --wco-right follows the real
         controls width (DPI scaling, geometrychange); gone in fullscreen (the controls are not drawn). */
      html.platform-win32:not(.window-fullscreen):not(.chrome-overlay):has(body:not(.vertical))::after,
      html.platform-win32:not(.window-fullscreen):not(.chrome-overlay):has(body.compact)::after {
        content: "";
        position: fixed;
        top: 0;
        right: var(--wco-right);
        width: 1px;
        height: 36px;
        background: var(--tabbar-line);
        z-index: 10;
        pointer-events: none;
      }

      html.platform-win32:not(.window-fullscreen):not(.chrome-overlay):has(body.compact)::after {
        height: 32px;
      }

      /* Vertical layout (Windows behaves like Linux): address bar and navigation live in the sidebar, the page starts at
         y=0 and the native controls float over its top-right corner. Empty sidebar space drags the window. */
      /* Only the empty strip beside the navigation buttons drags (its buttons opt out below). The rest of the sidebar must
         NOT be a drag region: Windows reports the document's drag regions to the window as the title bar (HTCAPTION)
         even where a popup WebContentsView lies over them, which swallowed every hover and click on a popup opened over
         the sidebar (the menu). */
      html.platform-win32:not(.chrome-overlay) body.vertical #nav-buttons {
        -webkit-app-region: drag;
      }

      /* Right sidebar: the controls float over its top, keep that corner free so they never cover its buttons.
         (The 36px extra sits inside the drag strip, 6px chrome padding + 36px = the former 42px.) */
      html.platform-win32 body.vertical.sidebar-right.wco-top #nav-buttons {
        padding-top: 36px;
      }

      html.platform-win32.window-fullscreen body.vertical.sidebar-right.wco-top #nav-buttons {
        padding-top: 0;
      }

      /* No title strip in the vertical layout (the sidebar is the drag area): the strip element takes no room. */
      html.platform-win32 body.vertical:not(.compact) #titlebar-drag {
        height: 0;
      }

      html.platform-win32 #titlebar-drag {
        -webkit-app-region: drag;
      }

      html.platform-win32 #chrome :is(button, input, form, a, select, textarea, browser-action-list, .tab-btn, #sidebar-resizer, #ext-actions) {
        -webkit-app-region: no-drag;
      }

      /* Vertical layout: the tab list (with its scrollbar) is never a drag region, so the scrollbar can be grabbed; only
         the empty space around the sidebar's controls (top) drags the window. */
      html.platform-win32 body.vertical #tab-scroll {
        -webkit-app-region: no-drag;
      }

      /* While a tab is dragged (HTML5 drag and drop) nothing may be a window drag region: over a drag region the OS
         does not deliver dragover/drop to the page, so the tab could not be dropped there (app.ts sets the class). */
      html.platform-win32 body.tab-dragging #chrome,
      html.platform-win32 body.tab-dragging #titlebar-drag,
      html.platform-win32 body.tab-dragging #nav-buttons {
        -webkit-app-region: no-drag !important;
      }

      /* While an overlay view (menu, tab menu, extension popup, prompt, palette, notes, find, glance...) is open above
         the window, no part of this document is a drag region: on Windows the regions are reported to the window as the
         caption area even under a child view, so clicks on the overlay would start a window drag instead. main.ts
         sends "overlay-open" (app.ts toggles the class). */
      html.platform-win32 body.overlay-open #chrome,
      html.platform-win32 body.overlay-open #titlebar-drag,
      html.platform-win32 body.overlay-open #nav-buttons {
        -webkit-app-region: no-drag !important;
      }

      /* Compact mode (the window's own shell): the page covers everything but a thin drag strip; the chrome comes back
         as the overlay instance when the pointer touches the top / side edge. The strip keeps its bottom line. */
      html.platform-win32 body.compact #chrome {
        visibility: hidden;
      }

      html.platform-win32 body.compact #titlebar-drag {
        height: 32px;
        background: var(--tabbar-bg);
        border-bottom: 1px solid var(--tabbar-line);
        z-index: 9;
      }

      /* ── Compact mode: this document is the chrome overlay (second shell instance) ── */
      html.chrome-overlay,
      html.chrome-overlay body {
        background: transparent !important;
      }

      html.chrome-overlay #placeholder {
        display: none !important;
      }

      /* ── Placeholder black screen ─────────────────────────── */
      #placeholder {
        position: fixed;
        top: 36px;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--mb-bg, #0a0a0a);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      #placeholder-new {
        padding: 14px 28px;
        border: 2px solid var(--mb-fg, #f0efe9);
        border-radius: 0;
        background: var(--mb-bg, #0a0a0a);
        color: var(--mb-fg, #f0efe9);
        font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
        letter-spacing: .12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #placeholder-new:hover, #placeholder-new:focus-visible { background: var(--mb-fg, #f0efe9); color: var(--mb-bg, #0a0a0a); outline: 0; }
      #placeholder-hint { color: var(--mb-muted, #a5a49e); font-size: 12px; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <div id="titlebar-drag" aria-hidden="true"></div>
    <div id="chrome">
      <div id="nav-buttons">
        <button id="back" class="nav-btn" type="button" aria-label="Wstecz" title="Wstecz (Alt+←)">
          <svg viewBox="0 0 16 16">
            <path d="M13.5 8a.75.75 0 0 0-.75-.75H4.81l2.72-2.72a.75.75 0 0 0-1.06-1.06l-4 4a.75.75 0 0 0 0 1.06l4 4a.75.75 0 0 0 1.06-1.06L4.81 8.75H12.75A.75.75 0 0 0 13.5 8Z" />
          </svg>
        </button>
        <button id="forward" class="nav-btn" type="button" aria-label="Dalej" title="Dalej (Alt+→)">
          <svg viewBox="0 0 16 16">
            <path d="M2.5 8a.75.75 0 0 1 .75-.75H11.19L8.47 4.53a.75.75 0 0 1 1.06-1.06l4 4a.75.75 0 0 1 0 1.06l-4 4a.75.75 0 0 1-1.06-1.06l2.72-2.72H3.25A.75.75 0 0 1 2.5 8Z" />
          </svg>
        </button>
        <button id="reload" class="nav-btn" type="button" aria-label="Odśwież" title="Odśwież (Ctrl+R)">
          <svg viewBox="0 0 16 16">
            <path d="M13.57 6.25a.75.75 0 0 0-1.42-.5l-.26.73A5.002 5.002 0 0 0 3 8a5 5 0 1 0 9.41-2.4.75.75 0 1 0-1.35.65A3.5 3.5 0 1 1 8 4.5c1.2 0 2.26.6 2.9 1.52l-.84-.29a.75.75 0 0 0-.5 1.41l2.5.88a.75.75 0 0 0 .96-.46l.55-1.56a.75.75 0 0 0-.5-.94Z" />
          </svg>
        </button>
      </div>

      <form id="address-form">
        <button id="site-info-button" class="address-icon" type="button" aria-haspopup="menu" aria-label="Informacje o stronie" title="Informacje o stronie">
          <svg viewBox="0 0 16 16">
            <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04Z" />
          </svg>
        </button>
        <input id="address" placeholder="Szukaj lub wpisz adres" autocomplete="off" spellcheck="false" />
      </form>

      <button id="ws-switch" type="button" aria-haspopup="menu" aria-label="Przestrzenie" title="Przestrzenie"><span id="ws-switch-icon"></span><svg class="ws-caret" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 2.75 4 5.75 7 2.75" /></svg></button>

      <div id="tabs" aria-label="Karty">
        <div id="pinned-list"></div>
        <div id="tab-divider"></div>
        <div id="tab-scroll">
          <div id="tab-list"></div>
        </div>
        <button id="new-tab" type="button" title="Nowa karta (Ctrl+T)" aria-label="Nowa karta">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2.5a.75.75 0 0 1 .75.75v4h4a.75.75 0 0 1 0 1.5h-4v4a.75.75 0 0 1-1.5 0v-4h-4a.75.75 0 0 1 0-1.5h4v-4A.75.75 0 0 1 8 2.5Z" />
          </svg>
          <span id="new-tab-label">Nowa karta</span>
        </button>
      </div>

      <div id="ws-bar" role="toolbar" aria-label="Przestrzenie">
        <div id="ws-list"></div>
        <button id="ws-add" type="button" title="Nowa przestrzeń" aria-label="Nowa przestrzeń"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a.75.75 0 0 1 .75.75v4h4a.75.75 0 0 1 0 1.5h-4v4a.75.75 0 0 1-1.5 0v-4h-4a.75.75 0 0 1 0-1.5h4v-4A.75.75 0 0 1 8 2.5Z" /></svg></button>
      </div>

      <div id="chrome-actions">
        <button id="sidebar-toggle" class="nav-btn vertical-only" type="button" aria-label="Zwiń panel boczny" title="Zwiń panel boczny">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path fill-rule="evenodd" d="M3.5 2A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 12.5 2h-9Zm0 1.5H5.5v9H3.5v-9Zm4 9v-9h5v9h-5Z" />
          </svg>
        </button>
        <button id="settings-button" class="nav-btn vertical-only" type="button" aria-label="Ustawienia" title="Ustawienia">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 4h6.2a2 2 0 0 1 3.6 0h1.2a.75.75 0 0 1 0 1.5h-1.2a2 2 0 0 1-3.6 0H2.5a.75.75 0 0 1 0-1.5Zm0 6.5h1.2a2 2 0 0 1 3.6 0h6.2a.75.75 0 0 1 0 1.5H7.3a2 2 0 0 1-3.6 0H2.5a.75.75 0 0 1 0-1.5Z" />
          </svg>
        </button>
        <div id="ext-actions" hidden></div>
        <button id="extensions-button" class="nav-btn" type="button" hidden aria-haspopup="menu" aria-label="Rozszerzenia" title="Rozszerzenia">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6.5 2.5a1.5 1.5 0 0 1 3 0V4h2.25c.41 0 .75.34.75.75V7h-1.5a1.5 1.5 0 0 0 0 3h1.5v2.25c0 .41-.34.75-.75.75H9.5v-1.5a1.5 1.5 0 0 0-3 0V13H4.25a.75.75 0 0 1-.75-.75V10H5a1.5 1.5 0 0 0 0-3H3.5V4.75c0-.41.34-.75.75-.75H6.5V2.5Z" />
          </svg>
        </button>
        <div id="toolbar-pins"></div>
        <button id="zoom-pill" type="button" hidden aria-label="Zoom" title="Zoom"></button>
        <button id="menu-button" class="nav-btn" type="button" aria-haspopup="menu" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 3.25h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Zm0 4h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Zm0 4h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Z" />
          </svg>
        </button>
      </div>

      <div id="sidebar-resizer" role="separator" aria-orientation="vertical"></div>
    </div>

    <div id="placeholder"><button id="placeholder-new" type="button"></button><div id="placeholder-hint"></div></div>
    <script src="./app.js"></script>
  </body>
</html>
